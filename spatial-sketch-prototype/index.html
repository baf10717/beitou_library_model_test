<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f4f4f1" />
  <title>Spatial Sketch Prototype</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f4f4f1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { overscroll-behavior: none; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .toolbar {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(16px);
      z-index: 10;
      white-space: nowrap;
    }
    button, input { font: inherit; }
    button {
      height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      background: #eceeed;
      color: #20242a;
      font-weight: 650;
      cursor: pointer;
    }
    button.active { background: #20242a; color: white; }
    button.primary { background: #2b65f9; color: white; }
    button:disabled { opacity: .38; cursor: default; }
    .height-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px 0 10px;
      height: 44px;
      background: #f4f5f4;
      border-radius: 12px;
    }
    .height-box input { width: 110px; }
    #heightLabel { min-width: 38px; font-variant-numeric: tabular-nums; font-weight: 650; }

    .hint {
      position: absolute;
      left: max(14px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
      max-width: min(520px, calc(100vw - 28px));
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 5px 24px rgba(0,0,0,.10);
      backdrop-filter: blur(12px);
      z-index: 10;
      font-size: 14px;
      line-height: 1.45;
      pointer-events: none;
    }
    .badge {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(32,36,42,.84);
      color: white;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .toolbar {
        left: 10px;
        right: 10px;
        transform: none;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .toolbar::-webkit-scrollbar { display: none; }
      button { padding: 0 13px; }
      .height-box input { width: 90px; }
      .badge { display: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.178.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.178.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <button id="drawBtn" class="active">畫線</button>
      <button id="orbitBtn">旋轉檢視</button>
      <div class="height-box">
        <span>高度</span>
        <input id="heightRange" type="range" min="1" max="30" value="6" step="0.5" />
        <span id="heightLabel">6 m</span>
      </div>
      <button id="extrudeBtn" class="primary" disabled>擠出</button>
      <button id="undoBtn">復原</button>
      <button id="clearBtn">清除</button>
    </div>
    <div class="hint" id="hint">畫線模式：按住拖曳畫一個封閉輪廓。系統會把手抖簡化成乾淨折線；首尾靠近時自動成面。</div>
    <div class="badge">Prototype 0.1 · local only</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const drawBtn = document.getElementById('drawBtn');
    const orbitBtn = document.getElementById('orbitBtn');
    const extrudeBtn = document.getElementById('extrudeBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const heightRange = document.getElementById('heightRange');
    const heightLabel = document.getElementById('heightLabel');
    const hint = document.getElementById('hint');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f1);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(18, 18, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.minDistance = 3;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.enabled = false;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a8, 2.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(12, 20, 9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    const grid = new THREE.GridHelper(60, 60, 0xa7abad, 0xd7d9d7);
    grid.position.y = 0;
    scene.add(grid);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.002;
    scene.add(ground);

    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const history = [];
    let mode = 'draw';
    let drawing = false;
    let activePointerId = null;
    let rawStroke = [];
    let previewLine = null;
    let activeFaceRecord = null;

    function setMode(next) {
      mode = next;
      const drawingMode = mode === 'draw';
      controls.enabled = !drawingMode;
      drawBtn.classList.toggle('active', drawingMode);
      orbitBtn.classList.toggle('active', !drawingMode);
      hint.textContent = drawingMode
        ? '畫線模式：按住拖曳畫一個封閉輪廓。系統會把手抖簡化成乾淨折線；首尾靠近時自動成面。'
        : '旋轉檢視：拖曳旋轉，滾輪或雙指縮放。要繼續建模就切回「畫線」。';
    }

    drawBtn.addEventListener('click', () => setMode('draw'));
    orbitBtn.addEventListener('click', () => setMode('orbit'));

    heightRange.addEventListener('input', () => {
      heightLabel.textContent = `${Number(heightRange.value).toFixed(Number(heightRange.value) % 1 ? 1 : 0)} m`;
    });

    function worldPointFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObject(ground, false)[0];
      return hit ? hit.point.clone() : null;
    }

    function distPointSegment2D(p, a, b) {
      const vx = b.x - a.x;
      const vz = b.z - a.z;
      const wx = p.x - a.x;
      const wz = p.z - a.z;
      const c1 = vx * wx + vz * wz;
      if (c1 <= 0) return Math.hypot(p.x - a.x, p.z - a.z);
      const c2 = vx * vx + vz * vz;
      if (c2 <= c1) return Math.hypot(p.x - b.x, p.z - b.z);
      const t = c1 / c2;
      return Math.hypot(p.x - (a.x + t * vx), p.z - (a.z + t * vz));
    }

    function simplifyRDP(points, epsilon = 0.22) {
      if (points.length < 3) return points.slice();
      let maxDistance = 0;
      let index = 0;
      const first = points[0];
      const last = points[points.length - 1];
      for (let i = 1; i < points.length - 1; i++) {
        const d = distPointSegment2D(points[i], first, last);
        if (d > maxDistance) {
          maxDistance = d;
          index = i;
        }
      }
      if (maxDistance > epsilon) {
        const left = simplifyRDP(points.slice(0, index + 1), epsilon);
        const right = simplifyRDP(points.slice(index), epsilon);
        return left.slice(0, -1).concat(right);
      }
      return [first, last];
    }

    function removeNearDuplicates(points, minDistance = 0.08) {
      const clean = [];
      for (const p of points) {
        if (!clean.length || clean[clean.length - 1].distanceTo(p) >= minDistance) clean.push(p);
      }
      return clean;
    }

    function makeLine(points, color = 0x22262b, opacity = 1) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p.x, 0.035, p.z)));
      const material = new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
      return new THREE.Line(geometry, material);
    }

    function updatePreview() {
      if (previewLine) {
        scene.remove(previewLine);
        previewLine.geometry.dispose();
        previewLine.material.dispose();
      }
      if (rawStroke.length < 2) return;
      previewLine = makeLine(rawStroke, 0x2b65f9, 0.9);
      scene.add(previewLine);
    }

    function makeShape(points) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0].x, -points[0].z);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, -points[i].z);
      shape.closePath();
      return shape;
    }

    function addOpenStroke(points) {
      const line = makeLine(points);
      scene.add(line);
      const record = { type: 'line', object: line, points };
      history.push(record);
      activeFaceRecord = null;
      extrudeBtn.disabled = true;
    }

    function addFace(points) {
      const group = new THREE.Group();
      const shape = makeShape(points);
      const geometry = new THREE.ShapeGeometry(shape);
      geometry.rotateX(-Math.PI / 2);
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.92,
        metalness: 0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.88,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
      });
      const face = new THREE.Mesh(geometry, material);
      face.position.y = 0.012;
      face.receiveShadow = true;
      group.add(face);

      const outlinePoints = [...points, points[0]];
      const outline = makeLine(outlinePoints, 0x20242a, 1);
      group.add(outline);
      scene.add(group);

      const record = { type: 'face', object: group, points: points.map(p => p.clone()) };
      history.push(record);
      activeFaceRecord = record;
      extrudeBtn.disabled = false;
    }

    function addExtrusion(points, height) {
      const shape = makeShape(points);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: height,
        bevelEnabled: false,
        steps: 1,
        curveSegments: 16
      });
      geometry.rotateX(-Math.PI / 2);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        color: 0xfafafa,
        roughness: 0.9,
        metalness: 0,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const record = { type: 'mass', object: mesh, points: points.map(p => p.clone()), height };
      history.push(record);
      activeFaceRecord = null;
      extrudeBtn.disabled = true;
    }

    function finishStroke() {
      if (previewLine) {
        scene.remove(previewLine);
        previewLine.geometry.dispose();
        previewLine.material.dispose();
        previewLine = null;
      }
      let points = removeNearDuplicates(rawStroke);
      rawStroke = [];
      if (points.length < 2) return;

      points = simplifyRDP(points, 0.24);
      if (points.length < 2) return;

      const first = points[0];
      const last = points[points.length - 1];
      const closeThreshold = Math.max(0.65, camera.position.distanceTo(controls.target) * 0.018);
      const closed = points.length >= 3 && first.distanceTo(last) <= closeThreshold;

      if (closed) {
        points[points.length - 1] = first.clone();
        points = points.slice(0, -1);
        if (points.length >= 3) addFace(points);
      } else {
        addOpenStroke(points);
      }
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (mode !== 'draw') return;
      if (event.button !== undefined && event.button !== 0) return;
      const point = worldPointFromEvent(event);
      if (!point) return;
      drawing = true;
      activePointerId = event.pointerId;
      rawStroke = [point];
      renderer.domElement.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!drawing || event.pointerId !== activePointerId) return;
      const point = worldPointFromEvent(event);
      if (!point) return;
      const previous = rawStroke[rawStroke.length - 1];
      if (!previous || previous.distanceTo(point) > 0.07) {
        rawStroke.push(point);
        updatePreview();
      }
      event.preventDefault();
    }, { passive: false });

    function endPointer(event) {
      if (!drawing || event.pointerId !== activePointerId) return;
      drawing = false;
      activePointerId = null;
      finishStroke();
      event.preventDefault();
    }

    renderer.domElement.addEventListener('pointerup', endPointer, { passive: false });
    renderer.domElement.addEventListener('pointercancel', endPointer, { passive: false });

    extrudeBtn.addEventListener('click', () => {
      if (!activeFaceRecord || activeFaceRecord.type !== 'face') return;
      const index = history.indexOf(activeFaceRecord);
      if (index >= 0) history.splice(index, 1);
      scene.remove(activeFaceRecord.object);
      disposeObject(activeFaceRecord.object);
      const points = activeFaceRecord.points;
      activeFaceRecord = null;
      addExtrusion(points, Number(heightRange.value));
      setMode('orbit');
    });

    function disposeObject(object) {
      object.traverse?.(child => {
        child.geometry?.dispose?.();
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose?.());
        else child.material?.dispose?.();
      });
    }

    undoBtn.addEventListener('click', () => {
      const record = history.pop();
      if (!record) return;
      scene.remove(record.object);
      disposeObject(record.object);
      if (record === activeFaceRecord) {
        activeFaceRecord = null;
        extrudeBtn.disabled = true;
      }
    });

    clearBtn.addEventListener('click', () => {
      while (history.length) {
        const record = history.pop();
        scene.remove(record.object);
        disposeObject(record.object);
      }
      activeFaceRecord = null;
      extrudeBtn.disabled = true;
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
