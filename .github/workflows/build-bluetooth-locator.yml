name: Build Device Last Seen APK

on:
  push:
    branches:
      - tmp-device-last-seen-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm -f project.tar.gz project.tar.gz.b64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DeviceLastSeen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceLastSeen-apk
          path: DeviceLastSeen.apk
          if-no-files-found: error
